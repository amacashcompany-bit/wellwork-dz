name: Supabase keep-alive

on:
  schedule:
    # Supabase recommends a few user database requests each day for Free projects.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Generate database activity
        shell: bash
        run: |
          endpoint="${SUPABASE_URL%/}/rest/v1/spaces?select=id&limit=1"

          for request in 1 2 3; do
            status="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 30 \
                --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
                "$endpoint"
            )"

            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "::error::Supabase database request $request returned HTTP $status."
              exit 1
            fi

            echo "Supabase database request $request succeeded with HTTP $status."
            if [[ "$request" -lt 3 ]]; then
              sleep 5
            fi
          done
