name: Supabase keep-alive

on:
  schedule:
    # Supabase recommends a few user database requests each day for Free projects.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Add SUPABASE_PUBLISHABLE_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Generate database activity
        shell: bash
        run: |
          supabase_url="https://yssuorvlptstvhtbwqmd.supabase.co"
          publishable_key="${SUPABASE_PUBLISHABLE_KEY//$'\r'/}"
          publishable_key="${publishable_key//$'\n'/}"
          publishable_key="${publishable_key#SUPABASE_PUBLISHABLE_KEY=}"
          publishable_key="${publishable_key#VITE_SUPABASE_PUBLISHABLE_KEY=}"
          publishable_key="${publishable_key#\"}"
          publishable_key="${publishable_key%\"}"
          publishable_key="${publishable_key#\'}"
          publishable_key="${publishable_key%\'}"
          endpoint="${supabase_url}/rest/v1/spaces?select=id&limit=1"

          for request in 1 2 3; do
            if ! status="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                --retry 2 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 30 \
                --header "apikey: $publishable_key" \
                "$endpoint"
            )"; then
              echo "::error::Could not reach Supabase. Check the SUPABASE_PUBLISHABLE_KEY secret."
              exit 1
            fi

            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "::error::Supabase database request $request returned HTTP $status."
              exit 1
            fi

            echo "Supabase database request $request succeeded with HTTP $status."
            if [[ "$request" -lt 3 ]]; then
              sleep 5
            fi
          done
